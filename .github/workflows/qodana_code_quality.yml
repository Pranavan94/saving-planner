#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#               https://www.jetbrains.com/help/qodana/github.html               #
#-------------------------------------------------------------------------------#

name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Explain skipped Qodana run when token is missing
        if: ${{ secrets.QODANA_TOKEN == '' }}
        run: |
          echo "Qodana scan skipped: repository secret QODANA_TOKEN is not configured."
          echo "Release Qodana linters require a Qodana Cloud token."
          echo "Create a token in https://qodana.cloud and save it as the GitHub Actions secret QODANA_TOKEN."

      - name: Qodana Scan
        if: ${{ secrets.QODANA_TOKEN != '' }}
        uses: JetBrains/qodana-action@v2025.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # When pr-mode is set to true, Qodana analyzes only the files that have been changed
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          upload-result: false
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'