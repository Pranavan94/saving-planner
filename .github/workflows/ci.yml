name: Saving-planner CI with Gradle

on:
  push:
    branches:
      - master
      - main
      - feature/**
      - bugfix/**
  pull_request:
    branches:
      - master
      - main
      - feature/**
      - bugfix/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build and test with Gradle
        run: ./gradlew build --no-daemon
   
