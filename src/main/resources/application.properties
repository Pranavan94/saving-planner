spring.application.name=saving-planner

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:saving_planner}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

# JWT / OAuth2 resource server
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:saving-planner}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT1H}

# Optional bootstrap admin for initial login
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap-admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:}
app.security.bootstrap-admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:}

